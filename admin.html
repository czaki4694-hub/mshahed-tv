
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة مِشاهِد TV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: #081426;
    }
    .login {
      width: 100%;
      max-width: 390px;
      padding: 30px;
      border-radius: 20px;
      background: #13243a;
      border: 1px solid #29415d;
      text-align: center;
    }
    h1 { color: #ff9d45; }
    p { color: #b8c6d8; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      color: white;
      background: #081426;
      border: 1px solid #40536b;
    }
    button {
      border: 0;
      background: #ff9d45;
      color: #211307;
      font-weight: bold;
      cursor: pointer;
    }
    #message { color: #ffb5a8; }
  </style>
</head>
<body>
  <main class="login">
    <h1>مِشاهِد TV</h1>
    <h2>لوحة الإدارة</h2>
    <p>سجّل الدخول بحساب المدير</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="البريد الإلكتروني" required>
      <input id="password" type="password"
        placeholder="كلمة المرور" required>
      <button type="submit">تسجيل الدخول</button>
    </form>
    <p id="message"></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL =
      'https://irkjsubiecrbhladkdko.supabase.co';

    const SUPABASE_KEY = 'sb_publishable_-wc1SLRAQm_pZLzLExy-Aw_j0kxFdjc';

    const supabase = createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'جارٍ التحقق...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email, password
      });

      if (error) {
        message.textContent = 'تعذر تسجيل الدخول. تحقق من البيانات.';
        return;
      }

      const { data: admin, error: adminError } = await supabase
        .from('admin_users')
        .select('user_id')
        .eq('user_id', data.user.id)
        .maybeSingle();

      if (adminError || !admin) {
        await supabase.auth.signOut();
        message.textContent = 'هذا الحساب ليس مديراً.';
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
