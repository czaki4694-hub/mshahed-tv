
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة مِشاهِد TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#081426;color:#fff;font-family:Arial,sans-serif}
header{background:#13243a;padding:22px;text-align:center;border-bottom:2px solid #ff9d45}
h1{color:#ff9d45;margin:0}
main{max-width:850px;margin:25px auto;padding:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.card,section{background:#13243a;border:1px solid #29415d;padding:20px;border-radius:15px}
.card{text-align:center}
.card strong{display:block;font-size:28px;color:#ff9d45}
section{margin-top:20px}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;font-size:15px}
input{background:#081426;color:white;border:1px solid #40536b}
button{background:#ff9d45;color:#211307;border:0;font-weight:bold;cursor:pointer}
.item{padding:14px 0;border-bottom:1px solid #40536b;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.actions button{font-size:13px;padding:10px}
.danger{background:#a83232;color:white}
.secondary{background:#40536b;color:white}
#message{color:#ffbd75;white-space:pre-wrap;line-height:1.7}
video{width:100%;background:#000;border-radius:10px;margin-top:10px}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h1>مِشاهِد TV</h1>
<p>لوحة الإدارة والتحكم</p>
</header>

<main>

<div class="cards">
<div class="card">القنوات<strong id="channelCount">0</strong></div>
<div class="card">المباريات<strong id="matchCount">0</strong></div>
</div>

<section>
<h2 id="formTitle">إضافة قناة</h2>
<form id="channelForm">
<input id="channelName" placeholder="اسم القناة" required>
<input id="logo" type="url" placeholder="رابط شعار القناة (اختياري)">
<input id="stream" type="url" placeholder="رابط البث المرخّص">
<input id="category" placeholder="التصنيف">

<button id="saveButton" type="submit">حفظ القناة</button>
<button type="button" class="secondary hidden" id="cancelEdit">إلغاء التعديل</button>
</form>
</section>

<section>
<h2>القنوات المسجلة</h2>
<div id="channelsList">جارٍ التحميل...</div>
</section>

<section>
<h2>اختبار البث</h2>
<p>اختر اختبار قناة من القائمة.</p>
<video id="preview" controls playsinline></video>
<button id="stopPreview" class="secondary">إيقاف الاختبار</button>
</section>

<section>
<h2>تسجيل الخروج</h2>
<button class="danger" id="logout">خروج من لوحة الإدارة</button>
<p id="message"></p>
</section>

</main>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import Hls from 'https://esm.sh/hls.js@1.5.17';

const SUPABASE_URL='https://irkjsubiecrbhladkdko.supabase.co';
const SUPABASE_KEY='sb_publishable_-wc1SLRAQm_pZLzLExy-Aw_j0kxFdjc';

const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const message=$('message');
const list=$('channelsList');
const preview=$('preview');

let editingId=null;
let hls=null;

async function checkAdmin(){
 try{
  const {data,error}=await supabase.auth.getUser();
  if(error)throw error;

  const user=data.user;

  if(!user){
   location.href='admin.html';
   return false;
  }

  const {data:admin,error:adminError}=await supabase
   .from('admin_users')
   .select('user_id')
   .eq('user_id',user.id)
   .maybeSingle();

  if(adminError)throw adminError;

  if(!admin){
   message.textContent='هذا الحساب ليس لديه صلاحية الإدارة';
   return false;
  }

  return true;
 }catch(error){
  message.textContent='خطأ التحقق من الحساب: '+error.message;
  return false;
 }
}

async function loadData(){
 message.textContent='جارٍ تحميل البيانات...';

 const [channels,matches]=await Promise.all([
  supabase.from('channels').select('*').order('created_at',{ascending:false}),
  supabase.from('matches').select('*')
 ]);

 if(channels.error){
  message.textContent='خطأ تحميل القنوات: '+channels.error.message;
  return;
 }

 if(matches.error){
  message.textContent='خطأ تحميل المباريات: '+matches.error.message;
  return;
 }

 $('channelCount').textContent=channels.data.length;
 $('matchCount').textContent=matches.data.length;

 list.replaceChildren();

 if(channels.data.length===0){
  list.textContent='لا توجد قنوات مسجلة';
 }

 channels.data.forEach(c=>{
  const item=document.createElement('div');
  item.className='item';

  const title=document.createElement('strong');
  title.textContent=c.name;

  const status=document.createElement('p');
  status.textContent=c.is_published?'منشورة':'مسودة';

  const link=document.createElement('small');
  link.textContent=c.stream_url||'لا يوجد رابط بث';

  const actions=document.createElement('div');
  actions.className='actions';

  const edit=document.createElement('button');
  edit.textContent='تعديل';
  edit.onclick=()=>editChannel(c);

  const test=document.createElement('button');
  test.textContent='اختبار البث';
  test.className='secondary';
  test.onclick=()=>playTest(c.stream_url);

  const publish=document.createElement('button');
  publish.textContent=c.is_published?'إلغاء النشر':'نشر القناة';
  publish.onclick=()=>togglePublish(c);

  const remove=document.createElement('button');
  remove.textContent='حذف';
  remove.className='danger';
  remove.onclick=()=>deleteChannel(c);

  actions.append(edit,test,publish,remove);
  item.append(title,status,link,actions);
  list.append(item);
 });

 message.textContent='تم تحميل البيانات بنجاح';
}

function editChannel(c){
 editingId=c.id;

 $('channelName').value=c.name||'';
 $('logo').value=c.logo_url||'';
 $('stream').value=c.stream_url||'';
 $('category').value=c.category||'';

 $('formTitle').textContent='تعديل القناة';
 $('saveButton').textContent='حفظ التعديلات';
 $('cancelEdit').classList.remove('hidden');

 window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
 editingId=null;
 $('channelForm').reset();
 $('formTitle').textContent='إضافة قناة';
 $('saveButton').textContent='حفظ القناة';
 $('cancelEdit').classList.add('hidden');
}

$('cancelEdit').onclick=resetForm;

$('channelForm').addEventListener('submit',async e=>{
 e.preventDefault();

 message.textContent='جارٍ حفظ القناة...';

 const values={
  name:$('channelName').value.trim(),
  country_id:null,
  logo_url:$('logo').value.trim()||null,
  stream_url:$('stream').value.trim()||null,
  category:$('category').value.trim()||null
 };

 let result;

 if(editingId){
  result=await supabase.from('channels')
   .update(values).eq('id',editingId);
 }else{
  result=await supabase.from('channels')
   .insert({...values,is_published:false});
 }

 if(result.error){
  message.textContent='تعذر الحفظ: '+result.error.message;
  return;
 }

 message.textContent=editingId?'تم تحديث القناة':'تمت إضافة القناة كمسودة';

 resetForm();
 await loadData();
});

async function togglePublish(c){
 const {error}=await supabase.from('channels')
  .update({is_published:!c.is_published}).eq('id',c.id);

 if(error){
  message.textContent='خطأ في النشر: '+error.message;
  return;
 }

 message.textContent=c.is_published?'تم إلغاء النشر':'تم نشر القناة';
 await loadData();
}

async function deleteChannel(c){
 if(!confirm('هل تريد حذف قناة '+c.name+'؟'))return;

 const {error}=await supabase.from('channels')
  .delete().eq('id',c.id);

 if(error){
  message.textContent='تعذر الحذف: '+error.message;
  return;
 }

 message.textContent='تم حذف القناة';
 await loadData();
}

function stopPreview(){
 if(hls){
  hls.destroy();
  hls=null;
 }

 preview.pause();
 preview.removeAttribute('src');
 preview.load();
}

function playTest(url){
 if(!url){
  message.textContent='لا يوجد رابط بث لهذه القناة';
  return;
 }

 stopPreview();

 if(url.toLowerCase().includes('.m3u8') && Hls.isSupported()){
  hls=new Hls();

  hls.on(Hls.Events.MEDIA_ATTACHED,()=>{
   hls.loadSource(url);
  });

  hls.on(Hls.Events.MANIFEST_PARSED,()=>{
   preview.play().catch(()=>{
    message.textContent='اضغط زر التشغيل داخل المشغل';
   });
  });

  hls.on(Hls.Events.ERROR,(event,data)=>{
   if(data.fatal){
    message.textContent='تعذر تشغيل البث. تحقق من الرابط أو صلاحيات CORS.';
   }
  });

  hls.attachMedia(preview);
 }else{
  preview.src=url;
  preview.play().catch(()=>{
   message.textContent='اضغط زر التشغيل داخل المشغل أو تحقق من الرابط';
  });
 }
}

$('stopPreview').onclick=stopPreview;

$('logout').onclick=async()=>{
 await supabase.auth.signOut();
 location.href='admin.html';
};

if(await checkAdmin()){
 await loadData();
}
</script>

</body>
</html>
